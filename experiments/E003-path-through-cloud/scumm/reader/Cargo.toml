[package]
name = "scumm-reader"
description = "E003's reader, the half that does not depend on the Machine: domains.py, reader.Scope, the Builder's records, build_task, prune, the starts, and a streaming writer into taskcore's packed format"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
scumm-ir.workspace = true
scumm-machine = { path = "../machine" }
flate2.workspace = true
rustc-hash.workspace = true
serde_json.workspace = true
sha1_smol.workspace = true
mimalloc = { version = "0.1", default-features = false }

[[bin]]
name = "reader-port"
path = "src/bin/reader_port.rs"
