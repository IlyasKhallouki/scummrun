[package]
name = "fmi-explore"
version = "0.1.0"
edition = "2021"
publish = false
description = "E011: the explorer (explore.py), its tries (step.py), the guide (guide.py) and the harness's planning loop (replay.Harness), in Rust"

[dependencies]
fmi-core = { path = "../fmi-core" }
scumm-ir = { path = "../../../E003-path-through-cloud/scumm/ir" }
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = "1"
sha1_smol = "1"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"

[profile.dev.package."*"]
opt-level = 2
