# E011's Rust workspace (experiments/E011-speed/plan.md, "Architecture"): every crate of the run, built together into
# the one binary `fmi`. taskcore (E003/taskcore) and scumm-ir/scumm-reader (E003/scumm) are path dependencies, used
# where they are; reader-scope and the taskcore CLI are built in their own folders.
[workspace]
resolver = "2"
members = ["fmi-core", "fmi-engine", "fmi-reading", "fmi-plan", "fmi-play", "fmi-explore", "fmi-shorten", "fmi", "fmi-checks"]
# fmi-checks turns on fmi-play's test doubles: built alone (-p fmi-checks), never with the fmi binary
default-members = ["fmi-core", "fmi-engine", "fmi-reading", "fmi-plan", "fmi-play", "fmi-explore", "fmi-shorten", "fmi"]

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = 1

[profile.dev.package."*"]
opt-level = 2

# for iterating: release code without LTO
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
