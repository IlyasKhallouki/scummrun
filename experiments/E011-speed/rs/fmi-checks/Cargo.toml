[package]
name = "fmi-checks"
version = "0.1.0"
edition = "2021"
publish = false
description = "E011 integration: the components' differential tests over the real ports (play's fixture tests on fmi-engine)"

[dependencies]
fmi-core = { path = "../fmi-core" }
fmi-engine = { path = "../fmi-engine" }
fmi-play = { path = "../fmi-play", features = ["json-double"] }
fmi-explore = { path = "../fmi-explore" }
scumm-ir = { path = "../../../E003-path-through-cloud/scumm/ir" }
scumm-machine = { path = "../../../E003-path-through-cloud/scumm/machine" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[[bin]]
name = "play-lean"
path = "src/bin/play_lean.rs"

[[bin]]
name = "play-wire"
path = "src/bin/play_wire.rs"

[[bin]]
name = "afford-check"
path = "src/bin/afford_check.rs"

[[bin]]
name = "delay-check"
path = "src/bin/delay_check.rs"

[[bin]]
name = "kitchen-report"
path = "src/bin/kitchen_report.rs"

[[bin]]
name = "inventory"
path = "src/bin/inventory.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"
