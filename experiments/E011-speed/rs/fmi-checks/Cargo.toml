[package]
name = "fmi-checks"
version = "0.1.0"
edition = "2021"
publish = false
description = "E011 integration: the components' differential tests over the real ports (play's fixture tests on fmi-engine)"

[dependencies]
fmi-core = { path = "../fmi-core" }
fmi-engine = { path = "../fmi-engine" }
fmi-play = { path = "../fmi-play", features = ["json-double"] }
fmi-explore = { path = "../fmi-explore" }
scumm-ir = { path = "../../../E003-path-through-cloud/scumm/ir" }
scumm-machine = { path = "../../../E003-path-through-cloud/scumm/machine" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[[bin]]
name = "play-lean"
path = "src/bin/play_lean.rs"

[[bin]]
name = "play-wire"
path = "src/bin/play_wire.rs"

[[bin]]
name = "afford-check"
path = "src/bin/afford_check.rs"

[[bin]]
name = "delay-check"
path = "src/bin/delay_check.rs"

[[bin]]
name = "kitchen-report"
path = "src/bin/kitchen_report.rs"

[[bin]]
name = "inventory"
path = "src/bin/inventory.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[[bin]]
name = "refuse-check"
path = "src/bin/refuse_check.rs"

[[bin]]
name = "stall-report"
path = "src/bin/stall_report.rs"

[[bin]]
name = "a3"
path = "src/bin/a3.rs"

[[bin]]
name = "e013-report"
path = "src/bin/e013_report.rs"

[[bin]]
name = "e015"
path = "src/bin/e015/main.rs"

[[bin]]
name = "e015chk"
path = "src/bin/e015chk.rs"

[[bin]]
name = "e015-g2"
path = "src/bin/e015_g2.rs"
